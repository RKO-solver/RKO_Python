[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rko"
version = "0.3.0"
description = "A Python library for Random-Key Optimization (RKO) with Ahead-of-Time C++20 Compiler."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Felipe Silvestre Cardoso Roberto", email = "felipe.silvestre@unifesp.br" },
  { name = "João Assaoka", email = "joao.assaoka@unifesp.br" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[project.urls]
"Homepage" = "https://github.com/RKO-solver/RKO_Python"
"Bug Tracker" = "https://github.com/RKO-solver/RKO_Python/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rko.compiler" = ["cpp_template/**/*", "cpp_template/*", "cpp_template/config/*", "cpp_template/src/**/*", "cpp_template/src/*/*"]
